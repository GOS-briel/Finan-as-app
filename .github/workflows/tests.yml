# Testes e cobertura a cada push e pull request (ADR-024).
# Falha se algum teste falhar ou se a cobertura ficar abaixo de 80% (fail_under no pyproject.toml).
# Os testes com a fatura real (marcador fatura_real) são pulados: o PDF não vai para o Git.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes com cobertura
        run: pytest --cov=backend --cov-report=term-missing
